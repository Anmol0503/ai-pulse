[project]
name = "ai-pulse"
version = "0.1.0"
description = "Pull what's new in AI, sorted into learn / know / skip and explained in plain English."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "feedparser>=6.0.11",
]

[project.scripts]
pulse = "pulse.__main__:main"
pulse-publish = "pulse.publish:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
