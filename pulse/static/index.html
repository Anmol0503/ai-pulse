<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Pulse</title>
<meta name="color-scheme" content="light dark">
<script>
  // ?theme=light or ?theme=dark forces a theme; otherwise the page follows the phone.
  (function () {
    var forced = null;
    try { forced = new URLSearchParams(location.search).get("theme"); } catch (e) {}
    if (forced === "light" || forced === "dark") document.documentElement.setAttribute("data-theme", forced);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,600;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<!--published-head-->
<style>
/* A morning letter: one left-aligned reading column, blue-black ink on cool paper, and one
   rubric red used only for the line to remember. Chosen by two critics from three designs. */
:root {
  color-scheme: light;
  --paper: #F4F6F8;
  --ink: #1A2233;
  --label: #3B4659;    /* the run-in labels: quieter than ink, never greyed out */
  --pencil: #556074;   /* dates, bylines, card numbers */
  --rule: #B9C2CF;     /* hairlines */
  --control: #7A8496;  /* the Go deeper outline: 3:1 or more */
  --rubric: #9F1D3C;   /* the one accent: Remember */
  --serif: "Alegreya", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: "Alegreya Sans", Seravek, "Gill Sans Nova", Ubuntu, Calibri, sans-serif;
  --measure: 32rem;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #131A27; --ink: #E6E9F0; --label: #C3C9D5; --pencil: #9AA3B5;
    --rule: #3A4558; --control: #7C879B; --rubric: #F08EA0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #131A27; --ink: #E6E9F0; --label: #C3C9D5; --pencil: #9AA3B5;
  --rule: #3A4558; --control: #7C879B; --rubric: #F08EA0;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 1.25rem/1.55 var(--sans);
  font-variant-numeric: lining-nums;  /* "0.5" and "7:30", never old-style "o.5" */
  font-kerning: normal;
  overflow-wrap: break-word;
}
.page {
  max-width: calc(var(--measure) + 2 * var(--gutter));
  margin-inline: auto;
  padding: 1.25rem var(--gutter) calc(2rem + env(safe-area-inset-bottom, 0px));
}
a { color: var(--ink); text-decoration-thickness: 1px; text-underline-offset: 0.22em; text-decoration-color: var(--pencil); }
a:hover { text-decoration-thickness: 2px; text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* reading progress: one thin segment per card, filling as you read it */
.progress {
  position: fixed; inset: 0 0 auto 0; z-index: 2;
  display: flex; gap: 3px; height: 3px;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--paper);
}
.progress span { flex: 1; background: var(--rule); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); }

/* letterhead */
.letterhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 1rem; }
.brand { margin: 0; font: 700 1.1875rem/1.3 var(--serif); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
.pull { display: inline-block; padding-block: 0.625rem; font-size: 1.0625rem; }
.pull-btn {
  min-height: 44px; padding: 0 1.1rem; border: 0; border-radius: 999px;
  background: var(--ink); color: var(--paper); font: 500 1.0625rem/1 var(--sans); cursor: pointer;
}
.pull-btn:disabled { opacity: 0.55; cursor: progress; }
select {
  min-height: 44px; padding: 0 0.75rem; border: 1.5px solid var(--control); border-radius: 999px;
  background: transparent; color: var(--ink); font: 400 1rem var(--sans);
}
.dateline { margin: 2.25rem 0 0; font-size: 1.0625rem; font-weight: 500; line-height: 1.4; color: var(--pencil); }
.title {
  margin: 0.375rem 0 0; font: 500 clamp(2.25rem, 1.75rem + 2vw, 3rem)/1.05 var(--serif);
  letter-spacing: -0.012em; text-wrap: balance;
}
.dateline[hidden] + .title { margin-top: 2.25rem; }  /* no date above it (a pull in progress): keep the breathing room */
.lede { margin: 1rem 0 0; color: var(--label); text-wrap: pretty; }
.note { margin: 1rem 0 0; font-size: 1.0625rem; color: var(--rubric); }

/* a pull in progress (on your Mac) */
.working { margin-top: 2rem; }
.working-status { margin: 0; color: var(--label); }
.meter { margin-top: 0.75rem; height: 3px; background: var(--rule); overflow: hidden; border-radius: 2px; }
.meter span { display: block; height: 100%; width: 0; background: var(--ink); transition: width 0.4s ease; }
.meter.busy span { width: 30%; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.working-clock { margin: 0.5rem 0 0; font-size: 1rem; color: var(--pencil); }
.warn { margin: 0.75rem 0 0; font-size: 1.0625rem; color: var(--rubric); }

/* the cards */
main { margin-top: 2.75rem; }
.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4.5rem; }
.card { display: flex; flex-direction: column; gap: 1.25rem; scroll-margin-top: 1.5rem; }
.mark { display: flex; align-items: center; gap: 0.875rem; color: var(--pencil); font: 500 1.125rem/1 var(--serif); }
.mark::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.headline { margin: 0; font: 600 clamp(1.625rem, 1.3rem + 1.1vw, 1.875rem)/1.18 var(--serif); text-wrap: balance; }
.byline { margin: 0.5rem 0 0; font-size: 1.0625rem; line-height: 1.45; color: var(--pencil); }
.prose { display: flex; flex-direction: column; gap: 1rem; }
.prose p { margin: 0; text-wrap: pretty; }
.runin { font-weight: 700; color: var(--label); }
.remember { margin: 0.25rem 0; display: flex; flex-direction: column; gap: 0.25rem; color: var(--rubric); }
.remember-label { font-size: 1.0625rem; font-weight: 500; line-height: 1.4; }
.remember-line { font: italic 500 clamp(1.5rem, 1.3rem + 0.8vw, 1.6875rem)/1.28 var(--serif); text-wrap: balance; }
.card-error { margin: 0; color: var(--label); }
.card-body { display: flex; flex-direction: column; gap: 1.25rem; margin-top: 1.25rem; }

/* Go deeper (an obvious button) and the source, on one row */
.entry-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; }
.deeper[open] { flex-basis: 100%; }
.deeper > summary {
  display: inline-flex; align-items: center; gap: 0.6rem; min-height: 44px; padding: 0 1rem;
  border: 1.5px solid var(--control); border-radius: 999px; cursor: pointer; list-style: none;
  font-size: 1.0625rem; font-weight: 500;
}
.deeper > summary::-webkit-details-marker { display: none; }
.deeper > summary::after {
  content: ""; width: 12px; height: 12px;
  background: linear-gradient(currentColor, currentColor) center / 12px 2px no-repeat,
              linear-gradient(currentColor, currentColor) center / 2px 12px no-repeat;
  transition: background-size 180ms ease;
}
.deeper[open] > summary::after { background-size: 12px 2px, 2px 0; }
.deeper-list { margin: 1.25rem 0 0.25rem; padding-left: 1rem; border-left: 2px solid var(--rule); display: flex; flex-direction: column; gap: 1.25rem; }
.deeper-list div { display: flex; flex-direction: column; gap: 0.25rem; }
.deeper-list dt { font-size: 1.0625rem; font-weight: 700; color: var(--label); }
.deeper-list dd { margin: 0; display: flex; flex-direction: column; gap: 0.375rem; font-size: 1.125rem; line-height: 1.5; }
.deeper-list p { margin: 0; }
.term { font: 600 1.25rem/1.3 var(--serif); }
.original { font-size: 1.0625rem; font-weight: 500; padding-block: 0.5rem; overflow-wrap: anywhere; }

/* the close: a page of its own */
.end {
  min-height: 85svh; margin-top: 3.5rem; padding-block: 3rem 2rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; text-align: center;
}
.sunrise { width: 44px; height: 22px; border-radius: 44px 44px 0 0; background: var(--rubric); position: relative; margin-bottom: 0.75rem; }
.sunrise::after { content: ""; position: absolute; left: -36px; right: -36px; bottom: 0; height: 1px; background: var(--rule); }
.end-title { margin: 0; font: 600 clamp(1.75rem, 1.4rem + 1.2vw, 2rem)/1.2 var(--serif); }
.recap { list-style: none; counter-reset: keep; margin: 1.25rem 0 0.5rem; padding: 0; max-width: 26rem; text-align: left; display: flex; flex-direction: column; gap: 0.75rem; }
.recap li { counter-increment: keep; display: grid; grid-template-columns: 1.5rem 1fr; gap: 0.25rem; font: italic 500 1.1875rem/1.35 var(--serif); }
.recap li::before { content: counter(keep); font-style: normal; color: var(--pencil); }
.end-next { margin: 0.5rem 0 0; font-size: 1.0625rem; color: var(--pencil); }
.end-more { margin: 1.5rem 0 0; font-size: 1rem; color: var(--pencil); }
.end-more label { display: inline-flex; align-items: center; gap: 0.6rem; }

@media (min-width: 48rem) {
  .page { padding-top: 3rem; }
  .dateline { margin-top: 3.5rem; }
  .cards { gap: 5.5rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="progress" id="progress" aria-hidden="true" hidden></div>
<div class="page">
  <header>
    <div class="letterhead">
      <p class="brand">AI Pulse</p>
      <div class="controls">
        <select id="engine" aria-label="Who writes the cards" hidden></select>
        <button id="pull" class="pull-btn" type="button" hidden>Pull latest</button>
        <a id="pull-link" class="pull" target="_blank" rel="noopener noreferrer" hidden>Pull now on GitHub<span class="vh"> (opens in a new tab)</span></a>
      </div>
    </div>
    <p class="dateline" id="dateline" hidden></p>
    <h1 class="title" id="title">AI Pulse</h1>
    <p class="lede" id="lede" hidden></p>
    <p class="note" id="note" hidden></p>
  </header>

  <section class="working" id="working" hidden>
    <p class="working-status" id="status" aria-live="polite"></p>
    <div class="meter" id="meter"><span></span></div>
    <p class="working-clock" id="clock" aria-hidden="true"></p>
    <div id="warnings"></div>
  </section>

  <main>
    <noscript><p class="lede">Turn on JavaScript to read today’s cards.</p></noscript>
    <ol class="cards" id="cards" aria-labelledby="title"></ol>
  </main>

  <footer class="end" id="end" hidden>
    <div class="sunrise" aria-hidden="true"></div>
    <h2 class="end-title">You’re caught up.</h2>
    <ol class="recap" id="recap" aria-label="The lines to remember"></ol>
    <p class="end-next" id="next" hidden></p>
    <p class="end-more" id="history-wrap" hidden><label>Earlier digests <select id="history"></select></label></p>
  </footer>
</div>
<p class="vh" id="announce" aria-live="polite"></p>

<script>window.PULSE_STATIC = null;</script>
<script>
"use strict";

const $ = (sel) => document.querySelector(sel);

// Build DOM from data. Strings always become text nodes, never HTML,
// so a scraped title can't inject markup into this page.
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "href") { if (/^https?:\/\//i.test(v)) { el.href = v; el.target = "_blank"; el.rel = "noopener noreferrer"; } }
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false || kid === "") continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const saved = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private window: fine */ } },
};

// The published copy (GitHub Pages) has no server: publish.py wrote the same answers as
// files. Paths stay relative, because the site lives under /<repo>/.
const STATIC = window.PULSE_STATIC;

function staticFile(path) {
  if (path === "/api/state") return "state.json";
  const m = path.match(/^\/api\/pulls\/(\d+)$/);
  return m ? `pulls/${m[1]}.json` : null;
}

async function api(path, opts) {
  if (STATIC) {
    const file = staticFile(path);
    if (!file || opts?.method === "POST") throw Object.assign(new Error("This copy is read-only."), { status: 405 });
    path = `${file}?v=${Date.now()}`;  // GitHub Pages caches for 10 minutes; a fresh pull should show at once
  }
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(body.detail || res.statusText); err.status = res.status; throw err; }
  return body;
}

/* ---------- words ---------- */

const COUNT_WORDS = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
const dayLabel = (d) => `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;

function countTitle(n) {
  if (n === 0) return "Nothing new that matters";
  return n === 1 ? "One thing that matters" : `${COUNT_WORDS[n] || n} things that matter`;
}

function ago(iso) {
  if (!iso) return null;
  const then = new Date(iso), now = new Date();
  const mins = Math.round((now - then) / 60000);
  if (mins < 2) return "just now";
  if (mins < 60) return `${mins} minutes ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return hours === 1 ? "an hour ago" : `${hours} hours ago`;
  const days = Math.round(hours / 24);
  if (days === 1) return "yesterday";
  if (days < 7) return `${days} days ago`;
  return `${then.getDate()} ${MONTHS[then.getMonth()].slice(0, 3)}`;
}

// Typewriter quotes into curly ones, so card text matches the page's own “You’re”.
function smart(text) {
  return String(text || "").trim()
    .replace(/(\w)'(\w)/g, "$1’$2").replace(/(\w)'/g, "$1’").replace(/'(\w)/g, "‘$1")
    .replace(/"(\S)/g, "“$1").replace(/(\S)"/g, "$1”");
}

function host(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; } }

/* ---------- state ---------- */

let STATE = null;   // /api/state
let stream = null;  // EventSource while a pull runs (on your Mac)
let clockTimer = null;

async function boot() {
  STATE = await api("/api/state");
  renderControls();
  renderHistory();
  if (STATE.running) return follow();
  const latest = STATE.pulls.find((p) => p.status === "done");
  if (latest) await showPull(latest.id);
  else showEmpty();
}

async function refreshState() {
  STATE = await api("/api/state");
  renderHistory();
}

/* ---------- header ---------- */

function renderControls() {
  if (STATIC) {  // the published copy: pulls run on GitHub, so the control opens "Run workflow" there
    const link = $("#pull-link");
    link.hidden = !STATIC.run_url;
    link.href = STATIC.run_url;
    return;
  }
  const sel = $("#engine");
  sel.replaceChildren();
  const want = saved.get("engine");
  let chosen = null;
  for (const [name, e] of Object.entries(STATE.engines)) {
    sel.append(h("option", { value: name, disabled: !e.ok, title: e.detail }, e.ok ? e.label : `${e.label} (unavailable)`));
    if (e.ok && (chosen === null || name === want)) chosen = name;
  }
  if (chosen) sel.value = chosen;
  sel.hidden = Object.keys(STATE.engines).length < 2;
  $("#pull").hidden = false;
  $("#pull").disabled = !chosen;
  if (!chosen) showNote("No model is available, so Pull is off. " + Object.values(STATE.engines).map((e) => e.detail).join(" "));
}

function setHeader({ date = null, title, lede = null }) {
  $("#dateline").hidden = !date;
  $("#dateline").textContent = date ? dayLabel(new Date(date)) : "";
  $("#title").textContent = title;
  $("#lede").hidden = !lede;
  $("#lede").textContent = lede || "";
}

function showNote(text) {
  $("#note").hidden = !text;
  $("#note").textContent = text || "";
}

function renderHistory() {
  const sel = $("#history");
  const current = sel.value;
  const done = STATE.pulls.filter((p) => p.status === "done");
  sel.replaceChildren(...done.map((p) => {
    const d = new Date(p.started_at);
    return h("option", { value: p.id }, `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}, ${plural(p.learn, "card")}`);
  }));
  $("#history-wrap").hidden = done.length < 2;
  if (current) sel.value = current;
}

/* ---------- reading progress ---------- */

function setProgress(n) {
  const bar = $("#progress");
  bar.replaceChildren(...Array.from({ length: n }, () => h("span", {}, h("i"))));
  bar.hidden = n === 0;
  updateProgress();
}

function updateProgress() {
  const segments = [...$("#progress").querySelectorAll("i")];
  if (!segments.length) return;
  const line = window.scrollY + window.innerHeight * 0.66;  // a card counts as read as its end passes two-thirds down
  [...document.querySelectorAll(".card")].forEach((card, i) => {
    const top = card.offsetTop, height = card.offsetHeight || 1;
    const share = Math.min(1, Math.max(0, (line - top) / height));
    if (segments[i]) segments[i].style.transform = `scaleX(${share})`;
  });
}

let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; updateProgress(); });
}, { passive: true });

/* ---------- one digest ---------- */

function showEmpty() {
  setHeader({
    title: "Nothing pulled yet",
    lede: STATIC
      ? (STATIC.schedule ? `The first pull runs ${STATIC.schedule}.` : "No digest has been published here yet.")
      : "Press Pull latest to fetch the last 7 days. Only the few that matter to you get a card.",
  });
  $("#cards").replaceChildren();
  $("#end").hidden = true;
  setProgress(0);
}

async function showPull(id) {
  const d = await api(`/api/pulls/${id}`);
  const p = d.pull;
  $("#history").value = String(p.id);
  $("#working").hidden = true;

  if (p.status !== "done") {
    setHeader({ date: p.started_at, title: "This pull didn’t finish",
                lede: p.error ? `${p.error} Nothing from it was marked as read, so the next pull picks it up again.` : null });
    $("#cards").replaceChildren();
    $("#end").hidden = true;
    setProgress(0);
    return;
  }

  const cards = d.learn;
  setHeader({ date: p.started_at, title: countTitle(cards.length),
              lede: cards.length ? null : "Nothing new passed your three questions. That’s a good day to build something." });
  showNote(p.engine === "ollama" && cards.length
    ? "Written by a small model on your Mac: it gets the gist and can invent details, so check facts in the original."
    : null);
  $("#cards").replaceChildren(...cards.map((r, i) => cardItem(r, i + 1, cards.length)));
  renderEnd(cards);
  setProgress(cards.length);
  window.scrollTo({ top: 0 });
}

function cardItem(r, n, total) {
  const c = r.card || {};
  const plain = "gist" in c;  // cards from before the plain-words redesign have other fields
  const parts = plain
    ? [["In plain words.", c.gist], ["Picture it.", c.picture], ["Why it matters to you.", c.why_you]]
    : [["Why it matters.", c.why_it_matters], ["Example.", c.example]];
  const prose = parts.filter(([, text]) => text).map(([label, text]) =>
    h("p", {}, h("span", { class: "runin" }, label), " ", smart(text)));

  const body = c.error
    ? [h("p", { class: "card-error" }, "This one couldn’t be explained this time. The original has the details.")]
    : [
        prose.length ? h("div", { class: "prose" }, prose) : null,
        c.remember ? h("p", { class: "remember" },
          h("span", { class: "remember-label" }, "Remember"), h("span", { class: "vh" }, ": "),
          h("span", { class: "remember-line" }, smart(c.remember))) : null,
      ];

  return h("li", { class: "card", id: `card-${n}` },
    h("div", { class: "mark", "aria-hidden": "true" }, `${n} of ${total}`),
    h("article", { "aria-labelledby": `card-${n}-h` },
      h("h2", { class: "headline", id: `card-${n}-h` }, smart(c.headline || r.headline || r.title)),
      h("p", { class: "byline" }, r.source, r.published_at ? `, ${ago(r.published_at)}` : ""),
      h("div", { class: "card-body" },
        body,
        h("div", { class: "entry-actions" },
          c.error ? null : deeper(c),
          h("a", { class: "original", href: r.url }, `Read the original${host(r.url) ? " on " + host(r.url) : ""}`,
            h("span", { class: "vh" }, " (opens in a new tab)"))))));
}

function deeper(c) {
  const row = (label, ...content) => content.some(Boolean) ? h("div", {}, h("dt", {}, label), h("dd", {}, ...content)) : null;
  const rows = [
    row("The word", c.term ? h("span", { class: "term" }, smart(c.term)) : null, c.term_meaning ? smart(c.term_meaning) : null),
    row("Say it", c.say_it ? h("p", {}, `“${smart(c.say_it)}”`) : null,
        c.follow_up_why ? h("p", {}, h("span", { class: "runin" }, "They ask why?"), ` “${smart(c.follow_up_why)}”`) : null),
    row("How sure", c.reality_check ? smart(c.reality_check) : null),
    row("Try it", c.try_it ? smart(c.try_it) : null),
  ].filter(Boolean);
  if (!rows.length) return null;
  return h("details", { class: "deeper" }, h("summary", {}, "Go deeper"), h("dl", { class: "deeper-list" }, rows));
}

function renderEnd(cards) {
  const lines = cards.map((r) => r.card?.remember).filter(Boolean);
  $("#recap").replaceChildren(...lines.map((line) => h("li", {}, smart(line))));
  $("#recap").hidden = lines.length < 2;
  const next = $("#next");
  next.hidden = !(STATIC && STATIC.schedule);
  next.textContent = next.hidden ? "" : `Next pull: ${nextPull()}`;
  $("#end").hidden = false;
}

// The daily cloud pull, in the reader's own time: "tomorrow at 7:30 am", "today at 7:30 am".
function nextPull() {
  const now = new Date();
  const at = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), STATIC.utc_hour ?? 2, STATIC.utc_minute ?? 0));
  if (at <= now) at.setUTCDate(at.getUTCDate() + 1);
  const day = at.toDateString() === now.toDateString() ? "today" : "tomorrow";
  return `${day} at ${at.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toLowerCase()}`;
}

/* ---------- a pull in progress (on your Mac) ---------- */

const STAGE_TEXT = {
  skim: (n) => `Reading the first lines of ${plural(n, "new item")}`,
  triage: (n) => `Picking what matters from ${plural(n, "item")}`,
  merge: () => "Folding together items that report the same story",
  read: (n) => `Reading ${plural(n, "full article")}`,
  explain: (n) => `Writing ${plural(n, "card")} in plain words`,
  check: (n) => `Checking ${plural(n, "card")} against their sources`,
};

function setBusy(busy) {
  $("#pull").disabled = busy || !$("#engine").value;
  $("#pull").textContent = busy ? "Pulling…" : "Pull latest";
  $("#engine").disabled = busy;
  clearInterval(clockTimer);
  $("#clock").textContent = "";
  if (busy) {
    const t0 = Date.now();
    clockTimer = setInterval(() => {
      const s = Math.round((Date.now() - t0) / 1000);
      $("#clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }, 1000);
  }
}

function status(text, share = null) {
  $("#status").textContent = text;
  const meter = $("#meter");
  meter.classList.toggle("busy", share === null);
  meter.firstChild.style.width = share === null ? "" : `${Math.round(share * 100)}%`;
}

function follow() {
  setBusy(true);
  setHeader({ title: "Pulling the latest…" });
  showNote(null);
  $("#cards").replaceChildren();
  $("#end").hidden = true;
  $("#warnings").replaceChildren();
  $("#working").hidden = false;
  setProgress(0);
  status("Connecting");

  let finished = false;
  let pullId = null;
  stream?.close();
  stream = new EventSource("/api/pull/events");

  stream.onmessage = async (msg) => {
    const ev = JSON.parse(msg.data);
    switch (ev.type) {
      case "start":
        pullId = ev.pull_id;
        status(`Checking ${plural(ev.sources.length, "source")}`);
        break;
      case "new":
        status(ev.count ? `Found ${plural(ev.count, "new item")}` : "Nothing you haven’t seen");
        break;
      case "stage":
        status(STAGE_TEXT[ev.stage] ? STAGE_TEXT[ev.stage](ev.total) : ev.stage);
        break;
      case "progress":
        if (STAGE_TEXT[ev.stage]) status(`${STAGE_TEXT[ev.stage](ev.total)}: ${ev.done} of ${ev.total}`, ev.done / ev.total);
        break;
      case "warning":
        $("#warnings").append(h("p", { class: "warn" }, ev.message));
        break;
      case "done":
        finished = true;
        stream.close();
        setBusy(false);
        await refreshState();
        await showPull(ev.pull_id);
        $("#announce").textContent = `Pull finished: ${plural(ev.learn, "card")}.`;
        break;
      case "error":
        finished = true;
        stream.close();
        setBusy(false);
        $("#working").hidden = true;
        setHeader({ title: "The pull didn’t finish",
                    lede: `${ev.message} Nothing was marked as read, so the next pull picks the same items up again.` });
        $("#announce").textContent = "The pull didn’t finish.";
        await refreshState();
        break;
    }
  };
  stream.addEventListener("end", async () => {
    stream.close();
    if (finished) return;
    // The stream ended without "done" or "error": the server restarted mid-pull. Show THAT pull.
    setBusy(false);
    $("#working").hidden = true;
    await refreshState();
    if (pullId != null) await showPull(pullId); else await boot();
  });
  stream.onerror = () => {
    if (finished) return;
    clearInterval(clockTimer);  // the browser keeps retrying on its own; say so instead of ticking forever
    status("Lost contact with the AI Pulse server. Is it still running in the terminal? Reconnecting…");
    if (stream.readyState === EventSource.CLOSED) setBusy(false);
  };
}

/* ---------- wiring ---------- */

$("#engine").addEventListener("change", (e) => saved.set("engine", e.target.value));

$("#pull").addEventListener("click", async () => {
  const engine = $("#engine").value;
  $("#pull").disabled = true;
  try {
    await api("/api/pull", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ engine }) });
  } catch (err) {
    if (err.status !== 409) {  // 409 = already running: just watch it
      $("#pull").disabled = false;
      showNote(err.message);
      return;
    }
  }
  follow();
});

$("#history").addEventListener("change", (e) => showPull(Number(e.target.value)));

boot().catch((err) => {
  setHeader({ title: "Couldn’t reach AI Pulse", lede: STATIC ? `${err.message}. Try reloading.` : `${err.message}. Start it with: uv run pulse` });
});
</script>
